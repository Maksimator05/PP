services:
  postgres:
    image: postgres:16
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail}
      POSTGRES_DB: ${POSTGRES_DB:-retail_forecast}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail_forecast}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    profiles: ["full"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: python scripts/run_demo.py

  dashboard:
    build: .
    profiles: ["full"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address=0.0.0.0

volumes:
  pg_data:
