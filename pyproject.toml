[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-category-forecast"
version = "0.1.0"
description = "Weekly retail category sales forecasting project"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["retail_forecast*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
